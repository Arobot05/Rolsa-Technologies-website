{% extends "base.html" %}

    {% block title %}
        Login 
    {% endblock %}

    {% block content %}
        <p class="is-size-1" style="text-align: center;">Log in Page</p>
        <div class="form-design">
            <form  action="{{url_for('login')}}" method="POST">
                <div class="field">
                    <label class="label" for="email">Email</label>
                    <input class="input input-design" type="email" id="email" name="email" required>
                </div>

                <div class="field">
                    <label class="label" for="password">Password</label>
                    <input class="input input-design" type="password" id="password" name="password" required>
                </div>

                <div class="field">
                    <a href="">
                        <p><strong>Forgot your password?</strong></p>
                    </a>

                    <div class="control">
                      <label class="checkbox">
                        <input type="checkbox" id="remember" name="remember">
                        Remember me
                      </label>
                    </div>
                </div>
                

                <button class="button is-medium is-fullwidth" type="submit">Login</button>

                <p>Don't have an account?<a href="{{url_for('sign_in')}}"><strong>Sign In</strong></p></a>

            </form>
    </div>
    {% endblock %}
